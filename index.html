<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Miesten illanvietto</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
    font-family:"Courier New",monospace}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block}
  #touch{display:none}
  body.touch #touch{display:block}
  .btn{position:fixed;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.32);color:#fff;font:bold 16px "Courier New",monospace;
    display:flex;align-items:center;justify-content:center;touch-action:none;z-index:5}
  .btn.on{background:rgba(255,255,255,.42)}
  .small{width:auto;height:34px;border-radius:10px;padding:0 10px;font-size:12px}
  #up{left:calc(58px + env(safe-area-inset-left));bottom:66px}
  #down{left:calc(58px + env(safe-area-inset-left));bottom:6px}
  #left{left:calc(6px + env(safe-area-inset-left));bottom:36px}
  #right{left:calc(110px + env(safe-area-inset-left));bottom:36px}
  #a{right:calc(16px + env(safe-area-inset-right));bottom:50px;width:62px;height:62px}
  #b{right:calc(88px + env(safe-area-inset-right));bottom:16px}
  #sw{top:44px;right:calc(8px + env(safe-area-inset-right))}
  #mute{top:84px;right:calc(8px + env(safe-area-inset-right))}
  #b{display:none}
  body.nodpad #up,body.nodpad #down,body.nodpad #left,body.nodpad #right{display:none}
  #rot{display:none;position:fixed;inset:0;background:#14101a;color:#f2e6c9;z-index:20;
    font:bold 20px "Courier New",monospace;align-items:center;justify-content:center;text-align:center;padding:24px}
  @media (orientation:portrait){ body.touch #rot{display:flex} }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="btn" id="up" data-k="up">&#9650;</div>
  <div class="btn" id="down" data-k="down">&#9660;</div>
  <div class="btn" id="left" data-k="left">&#9664;</div>
  <div class="btn" id="right" data-k="right">&#9654;</div>
  <div class="btn" id="a" data-k="a">A</div>
  <div class="btn" id="b" data-k="b">B</div>
  <div class="btn small" id="sw" data-k="sw">SWITCH</div>
  <div class="btn small" id="mute" data-k="mute">SOUND</div>
</div>
<div id="rot">Rotate your phone to landscape<br><br>&#8635;</div>
<script>
// ===== 00-core.js =====
'use strict';
// Miesten illanvietto: core engine (canvas, input, scene manager, game state)

const W = 480, H = 270;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const NAMES = ['rauno', 'tuomas', 'antti'];
const CH = {
  rauno:  { name: 'Rauno',  color: '#8fe36a' },
  tuomas: { name: 'Tuomas', color: '#f2a65a' },
  antti:  { name: 'Antti',  color: '#9ec5ff' },
};

// ---------- screen fitting ----------
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const sc = s >= 2 ? Math.floor(s) : s;
  cv.style.width = Math.floor(W * sc) + 'px';
  cv.style.height = Math.floor(H * sc) + 'px';
}
addEventListener('resize', fit);
addEventListener('orientationchange', fit);
fit();

// ---------- input ----------
const Input = { down: {}, pressed: {} };
function setKey(k, v) {
  if (v && !Input.down[k]) Input.pressed[k] = true;
  Input.down[k] = v;
}
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  Space: 'a', Enter: 'a', KeyZ: 'a', KeyX: 'b', Escape: 'b', Backspace: 'b',
  KeyC: 'sw', Tab: 'sw', KeyM: 'mute',
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Snd.unlock();
  setKey(k, true);
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  setKey(k, false);
});
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || 'ontouchstart' in window;
if (IS_TOUCH) document.body.classList.add('touch');
document.querySelectorAll('[data-k]').forEach(el => {
  const k = el.dataset.k;
  const on = e => { e.preventDefault(); Snd.unlock(); setKey(k, true); el.classList.add('on'); };
  const off = e => { e.preventDefault(); setKey(k, false); el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
});
// tap on the canvas = A (advance dialogue)
cv.addEventListener('pointerdown', e => { e.preventDefault(); Snd.unlock(); setKey('a', true); });
cv.addEventListener('pointerup', () => setKey('a', false));
cv.addEventListener('pointercancel', () => setKey('a', false));
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- game state ----------
let G = null;
function newGame(start) {
  G = {
    player: start || 'tuomas',
    mood: 55, hunger: 35,
    bac: { rauno: 0, tuomas: 0, antti: 0 },
    beers: { rauno: 0, tuomas: 0, antti: 0 },
    shop: {}, flags: {}, log: [], snaps: [],
    chips: { rauno: 100, tuomas: 100, antti: 100 },
    pokerWins: { rauno: 0, tuomas: 0, antti: 0 },
    stats: {},
  };
}
newGame();
const addMood = n => { G.mood = clamp(G.mood + n, 0, 100); };
const addHunger = n => { G.hunger = clamp(G.hunger + n, 0, 100); };
function drinkBeer(who, n) {
  const k = n || 1;
  G.beers[who] += k;
  G.bac[who] = clamp(G.bac[who] + 0.07 * k, 0, 1);
}
function drinkAll(n) { NAMES.forEach(c => drinkBeer(c, n)); }
const others = (me) => NAMES.filter(c => c !== (me || G.player));
const nm = c => CH[c].name;

// event log: used to build the credits
function logEvent(id, credit, snap) {
  G.log.push({ id, credit, t: G.log.length });
  if (snap) Snap.take(id, credit);
}
const Snap = {
  take(id, caption) {
    try {
      const c = document.createElement('canvas');
      c.width = 240; c.height = 135;
      c.getContext('2d').drawImage(cv, 0, 0, 240, 135);
      G.snaps.push({ id, canvas: c, caption: caption || '' });
    } catch (e) { /* ignore */ }
  },
};

// ---------- toast ----------
const Toast = { text: '', t: 0, show(s, d) { this.text = s; this.t = d || 1.6; } };

// ---------- scene manager ----------
const Scenes = {
  cur: null, pending: null, fade: 0, state: 'run', time: 0,
  go(s, d) {
    if (this.pending) return;
    this.pending = { s, d };
    this.state = this.cur ? 'out' : 'swap';
    this.fade = 0;
  },
  update(dt) {
    this.time += dt;
    if (Toast.t > 0) Toast.t -= dt;
    if (this.state === 'out') {
      this.fade = Math.min(1, this.fade + dt / 0.22);
      if (this.fade >= 1) this.state = 'swap';
    }
    if (this.state === 'swap') {
      const p = this.pending; this.pending = null;
      this.cur = p.s;
      this.state = 'in'; this.fade = 1;
      if (this.cur.music !== undefined) Music.play(this.cur.music);
      if (this.cur.enter) this.cur.enter(p.d);
      Input.pressed = {};
    } else if (this.state === 'in') {
      this.fade = Math.max(0, this.fade - dt / 0.22);
      if (this.fade <= 0) this.state = 'run';
      Input.pressed = {};
    }
    if (!this.cur) return;
    if (Input.pressed.mute) { Snd.toggleMute(); }
    if (this.state === 'run' && Input.pressed.sw && !this.cur.noSwitch && G) {
      const i = NAMES.indexOf(G.player);
      G.player = NAMES[(i + 1) % 3];
      Snd.sfx('switch');
      Toast.show('Now playing: ' + nm(G.player));
      if (this.cur.onSwitch) this.cur.onSwitch();
    }
    if (this.state !== 'out' || true) this.cur.update(dt);
  },
  draw() {
    if (this.cur) this.cur.draw(ctx);
    else { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
  },
};

// ===== 10-audio.js =====
// Audio: Web Audio chiptune music + synthesized sound effects (no audio files)

const Snd = (() => {
  let ac = null, master = null, musicGain = null, sfxGain = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('mi_muted') === '1'; } catch (e) { /* ignore */ }

  function unlock() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
      musicGain = ac.createGain(); musicGain.gain.value = 0.30; musicGain.connect(master);
      sfxGain = ac.createGain(); sfxGain.gain.value = 0.8; sfxGain.connect(master);
      const len = ac.sampleRate;
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      Music.begin();
    } catch (e) { ac = null; }
  }
  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('mi_muted', muted ? '1' : '0'); } catch (e) { /* ignore */ }
    if (master) master.gain.value = muted ? 0 : 0.6;
    Toast.show(muted ? 'Sound off' : 'Sound on');
  }
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function freq(n) {
    const m = /^([A-G])([#b]?)(\d)$/.exec(n);
    if (!m) return 0;
    const s = NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    const midi = 12 * (+m[3] + 1) + s;
    return 440 * Math.pow(2, (midi - 69) / 12);
  }
  function tone(f, t0, dur, type, vol, dest, slideTo) {
    if (!ac || !f) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + Math.max(0.03, dur));
    o.connect(g); g.connect(dest || sfxGain);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function noise(t0, dur, vol, dest, hp) {
    if (!ac) return;
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = s;
    if (hp) { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; s.connect(f); node = f; }
    node.connect(g); g.connect(dest || sfxGain);
    s.start(t0); s.stop(t0 + dur + 0.05);
  }
  function sfx(name) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    const seq = (notes, step, type, vol, dur) => notes.forEach((n, i) => tone(freq(n), t + i * step, dur || step * 1.3, type || 'square', vol || 0.2));
    switch (name) {
      case 'select': tone(880, t, 0.05, 'square', 0.12); break;
      case 'confirm': seq(['E5', 'A5'], 0.06, 'square', 0.18); break;
      case 'back': seq(['A4', 'E4'], 0.06, 'square', 0.15); break;
      case 'bad': tone(180, t, 0.25, 'sawtooth', 0.2, null, 70); break;
      case 'good': seq(['C5', 'E5', 'G5', 'C6'], 0.06, 'square', 0.18); break;
      case 'coin': seq(['B5', 'E6'], 0.07, 'square', 0.16); break;
      case 'switch': seq(['C5', 'G5'], 0.05, 'triangle', 0.25); break;
      case 'crash': noise(t, 0.5, 0.5); tone(220, t, 0.5, 'sawtooth', 0.25, null, 40); break;
      case 'cone': noise(t, 0.12, 0.35); tone(300, t, 0.1, 'square', 0.15, null, 120); break;
      case 'bump': tone(120, t, 0.1, 'square', 0.2, null, 60); break;
      case 'checkpoint': seq(['G5', 'C6'], 0.07, 'square', 0.16); break;
      case 'finish': seq(['C5', 'E5', 'G5', 'C6', 'E6', 'G6'], 0.07, 'square', 0.16); break;
      case 'ring': seq(['E6', 'A6'], 0.05, 'triangle', 0.3); break;
      case 'sizzle': noise(t, 0.7, 0.28, null, 2500); break;
      case 'steam': noise(t, 0.9, 0.3, null, 1200); tone(200, t, 0.5, 'triangle', 0.1, null, 400); break;
      case 'card': noise(t, 0.05, 0.3, null, 3000); tone(500, t, 0.03, 'square', 0.06); break;
      case 'chip': tone(1600, t, 0.03, 'square', 0.1); tone(2100, t + 0.04, 0.03, 'square', 0.1); break;
      case 'clink': tone(2093, t, 0.18, 'triangle', 0.25); tone(2637, t + 0.02, 0.18, 'triangle', 0.18); break;
      case 'love': seq(['E5', 'G5', 'B5', 'E6'], 0.09, 'triangle', 0.3, 0.2); break;
      case 'burn': noise(t, 0.4, 0.3, null, 800); tone(300, t, 0.4, 'sawtooth', 0.12, null, 60); break;
      case 'win': seq(['C5', 'C5', 'C5', 'E5', 'G5', 'E5', 'G5', 'C6'], 0.09, 'square', 0.18); break;
      case 'lose': seq(['E4', 'D4', 'C4', 'A3'], 0.12, 'triangle', 0.3, 0.2); break;
      case 'tick': tone(1000, t, 0.02, 'square', 0.07); break;
      case 'whoosh': noise(t, 0.3, 0.25, null, 600); break;
      case 'hot': tone(260, t, 0.25, 'sawtooth', 0.1, null, 520); break;
      default: break;
    }
  }
  function blip(ch) {
    if (!ac || muted) return;
    const f = 260 + (ch.charCodeAt(0) % 12) * 18;
    tone(f, ac.currentTime, 0.03, 'square', 0.035);
  }
  return { unlock, toggleMute, sfx, blip, freq, tone, noise, ctx: () => ac, music: () => musicGain, isMuted: () => muted };
})();

// ---------- music sequencer ----------
// Tracks: lead/bass are space separated tokens, one token = one eighth note.
// '-' rest, '_' hold previous note, '|' bar line (ignored). perc: k kick, s snare, h hat, '.' none.
const TRACKS = {
  title: { bpm: 132, wave: 'square',
    lead: 'C5 E5 G5 E5 C5 E5 G5 _ | A4 C5 E5 C5 A4 C5 E5 _ | F4 A4 C5 A4 F4 A4 C5 _ | G4 B4 D5 B4 G5 _ D5 _',
    bass: 'C3 _ C3 _ G2 _ G2 _ | A2 _ A2 _ E3 _ E3 _ | F2 _ F2 _ C3 _ C3 _ | G2 _ G2 _ G2 _ B2 _',
    perc: 'k.h.s.h. k.h.s.h. k.h.s.h. k.hks.hh' },
  day: { bpm: 142, wave: 'square',
    lead: 'G4 B4 D5 B4 G4 B4 D5 _ | E5 D5 B4 D5 E5 _ - - | C5 E5 G5 E5 C5 E5 G5 _ | D5 C5 B4 A4 G4 _ - -',
    bass: 'G2 - D3 - G2 - D3 - | E2 - B2 - E2 - B2 - | C3 - G3 - C3 - G3 - | D3 - A3 - D3 - G2 -',
    perc: 'k.hhs.hh k.hhs.hh k.hhs.hh k.hhs.sk' },
  sauna: { bpm: 76, wave: 'triangle',
    lead: 'D5 _ _ _ F5 _ A5 _ | G5 _ _ _ F5 _ E5 _ | D5 _ _ _ C5 _ A4 _ | Bb4 _ A4 _ D5 _ _ _',
    bass: 'D3 _ _ _ A3 _ _ _ | G2 _ _ _ D3 _ _ _ | Bb2 _ _ _ F3 _ _ _ | A2 _ _ _ D3 _ _ _',
    perc: '........ ....h... ........ ....h...' },
  kitchen: { bpm: 156, wave: 'square',
    lead: 'A4 - C5 A4 E5 - C5 A4 | G4 - B4 G4 D5 - B4 G4 | F4 - A4 F4 C5 - A4 F4 | E4 G4 B4 E5 D5 - B4 -',
    bass: 'A2 A2 - A3 A2 - E3 - | G2 G2 - G3 G2 - D3 - | F2 F2 - F3 F2 - C3 - | E2 E2 - E3 E2 - B2 -',
    perc: 'k.h.s.hk k.h.s.hk k.h.s.hk k.hks.hh' },
  poker: { bpm: 104, wave: 'square',
    lead: 'E4 - - G4 - B4 - - | A4 - - C5 - E5 - - | D4 - - F4 - A4 - - | B3 - D4 - E4 - - -',
    bass: 'E2 - E2 - G2 - E2 - | A2 - A2 - C3 - A2 - | D2 - D2 - F2 - D2 - | B1 - B2 - E2 - E2 -',
    perc: 'k...s.h. k.h.s... k...s.h. k.h.s.hs' },
  restaurant: { bpm: 126, wave: 'square',
    lead: 'F5 A5 C6 A5 F5 A5 C6 _ | Bb5 A5 G5 F5 E5 _ - - | D5 F5 A5 F5 D5 F5 A5 _ | G5 F5 E5 D5 C5 _ - -',
    bass: 'F3 - C3 - F3 - C3 - | Bb2 - F3 - Bb2 - F3 - | D3 - A2 - D3 - A2 - | C3 - G2 - C3 - E3 -',
    perc: 'k.h.s.h. k.h.s.hh k.h.s.h. k.hks.hh' },
  night: { bpm: 88, wave: 'triangle',
    lead: 'A4 _ C5 _ E5 _ D5 _ | C5 _ _ _ A4 _ - - | F4 _ A4 _ C5 _ B4 _ | G4 _ _ _ E4 _ - -',
    bass: 'A2 _ _ _ E3 _ _ _ | C3 _ _ _ G3 _ _ _ | F2 _ _ _ C3 _ _ _ | G2 _ _ _ E3 _ _ _',
    perc: 'k....... ....s... k....... ....s.h.' },
  credits: { bpm: 108, wave: 'square',
    lead: 'C5 _ E5 _ G5 _ E5 _ | F5 _ A5 _ G5 _ E5 _ | D5 _ F5 _ A5 _ F5 _ | G5 _ B5 _ C6 _ - -',
    bass: 'C3 - G2 - C3 - G2 - | F2 - C3 - F2 - C3 - | D3 - A2 - D3 - A2 - | G2 - D3 - C3 - G2 -',
    perc: 'k.h.s.h. k.h.s.h. k.h.s.h. k.hks.hh' },
};

const Music = (() => {
  let cur = null, want = null, step = 0, nextT = 0, timer = null;
  const parsed = {};
  function parse(str) {
    const toks = str.split(/[\s|]+/).filter(Boolean);
    const out = [];
    for (let i = 0; i < toks.length; i++) {
      if (toks[i] === '-' || toks[i] === '_') { out.push(null); continue; }
      let len = 1;
      while (toks[i + len] === '_') len++;
      out.push({ f: Snd.freq(toks[i]), len });
    }
    return out;
  }
  function get(name) {
    if (!parsed[name]) {
      const t = TRACKS[name];
      parsed[name] = { t, lead: parse(t.lead), bass: parse(t.bass), perc: t.perc.replace(/\s/g, '') };
    }
    return parsed[name];
  }
  function tick() {
    const ac = Snd.ctx();
    if (!ac || !cur) return;
    const p = get(cur), dur = 60 / p.t.bpm / 2;
    while (nextT < ac.currentTime + 0.2) {
      const L = p.lead[step % p.lead.length], B = p.bass[step % p.bass.length], c = p.perc[step % p.perc.length];
      if (L) Snd.tone(L.f, nextT, L.len * dur * 0.92, p.t.wave, 0.20, Snd.music());
      if (B) Snd.tone(B.f, nextT, B.len * dur * 0.95, 'triangle', 0.34, Snd.music());
      if (c === 'k') Snd.tone(140, nextT, 0.11, 'sine', 0.5, Snd.music(), 40);
      else if (c === 's') Snd.noise(nextT, 0.11, 0.30, Snd.music(), 1500);
      else if (c === 'h') Snd.noise(nextT, 0.03, 0.12, Snd.music(), 6000);
      nextT += dur; step++;
    }
  }
  function start(name) {
    const ac = Snd.ctx();
    cur = name; step = 0;
    if (!ac) return;
    nextT = ac.currentTime + 0.08;
    if (!timer) timer = setInterval(tick, 40);
  }
  function play(name) {
    if (name === want) return;
    want = name;
    if (!name) { cur = null; return; }
    start(name);
  }
  function begin() { if (want) start(want); }
  return { play, begin, current: () => want };
})();

// ===== 20-sprites.js =====
// Pixel-art characters, drawn procedurally (32x62 full body). Ported from tools/generate_sprites.py.
// Variants: 'out' (hats/caps), 'in' (indoors), 'sauna' (bare head, towel). Expressions: normal, drunk, hot.

const Sprites = (() => {
  const SW = 32, SH = 62;
  const SK = '#e8b996', SKS = '#c98f6e', SKH = '#f2cdb0', BLK = '#15151b', BLK2 = '#23232c';
  const EYE = '#1c1218', MOUTH = '#a8504a', WHITE = '#f4f4f4';
  const cache = {};

  function make(name, variant, expr, pose) {
    const c = document.createElement('canvas'); c.width = SW; c.height = SH;
    const g = c.getContext('2d');
    const R = (x0, y0, x1, y1, col) => { g.fillStyle = col; g.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1); };
    const P = (pts, col) => { g.fillStyle = col; for (const p of pts) g.fillRect(p[0], p[1], 1, 1); };

function subst(s) {
  if (typeof s === 'function') s = s();
  const o = others();
  return String(s)
    .replace(/\{P\}/g, nm(G.player))
    .replace(/\{O1\}/g, nm(o[0])).replace(/\{O2\}/g, nm(o[1]))
    .replace(/\{T\}/g, nm(G.flags.target || o[0]));
}

// ---------- cutscene ----------
// o: { bg:(t)=>void, fg?:(t)=>void, floor, cast:[{c,x,v,flip,expr,y}], steps:[], music, bust, onEnd:(scene)=>void }
// step kinds: {who,text} {narr:true,text} {choice:[...],text,on:(i,scene)=>steps?} {fn:(scene)=>steps?} {wait:sec}
function Cutscene(o) {
  const S = {
    music: o.music, t: 0, cast: (o.cast || []).map(c => Object.assign({}, c)),
    steps: o.steps.slice(), i: -1, cur: null, typed: 0, sel: 0, waitT: 0, lastBlip: 0, finished: false,
  };
  S.enter = function () { this.advance(); };
  S.dpad = function () { return !!(this.cur && this.cur.choice); };
  S.char = function (c) { return this.cast.find(x => x.c === c); };
  S.advance = function () {
    this.i++;
    for (;;) {
      const st = this.steps[this.i];
      if (!st) { this.cur = { end: true }; if (!this.finished) { this.finished = true; if (o.onEnd) o.onEnd(this); } return; }
      if (st.fn) {
        const r = st.fn(this);
        if (Array.isArray(r)) this.steps.splice(this.i + 1, 0, ...r);
        this.i++; continue;
      }
      if (st.wait !== undefined) { this.waitT = st.wait; this.cur = st; return; }
      this.cur = st; this.typed = 0; this.sel = 0; this.lastBlip = 0;
      this.text = subst(st.text || '');
      if (st.choice) this.opts = (typeof st.choice === 'function' ? st.choice() : st.choice).map(subst);
      return;
    }
  };
  S.update = function (dt) {
    this.t += dt;
    const st = this.cur;
    if (!st || st.end) return;
    if (st.wait !== undefined) { this.waitT -= dt; if (this.waitT <= 0) this.advance(); return; }
    if (st.choice) {
      if (Input.pressed.up) { this.sel = (this.sel + this.opts.length - 1) % this.opts.length; Snd.sfx('select'); }
      if (Input.pressed.down) { this.sel = (this.sel + 1) % this.opts.length; Snd.sfx('select'); }
      if (Input.pressed.a) {
        Snd.sfx('confirm');
        const r = st.on ? st.on(this.sel, this) : null;
        if (Array.isArray(r)) this.steps.splice(this.i + 1, 0, ...r);
        this.advance();
      }
      return;
    }
    const before = Math.floor(this.typed);
    this.typed += dt * 55;
    const now = Math.floor(this.typed);
    if (now > before && now % 2 === 0 && st.who && now <= this.text.length) Snd.blip(this.text[Math.min(now, this.text.length - 1)] || 'a');
    if (Input.pressed.a) {
      if (this.typed < this.text.length) this.typed = this.text.length;
      else this.advance();
    }
  };
  S.draw = function (g) {
    o.bg(this.t);
    const floor = o.floor || 240;
    const st = this.cur || {};
    this.cast.forEach(c => {
      const speaking = st.who === c.c && this.typed < (this.text || '').length;
      const bob = speaking ? Math.round(Math.sin(this.t * 16) * 1.5) : 0;
      const fy = (c.y !== undefined ? c.y : floor) + bob;
      const drunk = G.bac[c.c] > 0.35 ? 'drunk' : undefined;
      Sprites.draw(ctx, c.c, c.v || 'in', c.x, fy, { flip: c.flip, expr: c.expr || drunk, pose: c.walk ? (Math.floor(this.t * 5) % 2 ? 'walk0' : 'walk1') : c.pose, bust: o.bust });
      if (c.c === G.player && !o.noMarker) T('▼', c.x, fy - (o.bust ? 56 : 74) + Math.round(Math.sin(this.t * 6) * 2), { align: 'center', c: '#ffd166', size: 10 });
    });
    if (o.fg) o.fg(this.t);
    applyWobble(G.bac[G.player] * 1.2, this.t);
    drawHUD();
    // dialog box
    if (st.end || st.wait !== undefined) { drawToast(); return; }
    const choice = !!st.choice;
    const by = choice ? 130 : 196, bh = choice ? 132 : 66;
    panel(8, by, W - 16, bh, '#10162e');
    let tx = 18;
    if (st.who) {
      Sprites.head(ctx, st.who, 'in', 16, by + 6, 2);
      tx = 78;
      const label = nm(st.who).toUpperCase();
      rect(14, by - 12, tw(label, 10) + 14, 12, CH[st.who].color);
      T(label, 21, by - 11, { size: 10, c: '#101010', shadow: false });
    }
    const shown = this.text.slice(0, Math.floor(this.typed));
    const lines = wrap(shown, W - 16 - tx - 12, 10);
    lines.forEach((l, i) => T(l, tx, by + 8 + i * 13, { size: 10, c: st.who ? '#f2e6c9' : '#cdd8ff' }));
    if (choice) {
      const oy = by + 10 + Math.max(1, wrap(this.text, W - 40, 10).length) * 13 + 6;
      this.opts.forEach((opt, i) => {
        const ws = wrap(opt, W - 60, 10);
        T((i === this.sel ? '► ' : '  ') + ws[0], 22, oy + i * 15, { size: 10, c: i === this.sel ? '#ffd166' : '#a8a3b8' });
      });
    } else if (this.typed >= this.text.length && Math.floor(this.t * 2.5) % 2 === 0) {
      T('▼', W - 28, by + bh - 16, { size: 10 });
    }
    drawToast();
  };
  return S;
}

// ---------- RC car course ----------
function RCScene(o) {
  const cps = [[80, 70], [240, 45], [420, 80], [420, 215], [240, 165], [60, 225]];
  const boxes = [{ x: 170, y: 120, w: 36, h: 22 }, { x: 340, y: 130, w: 30, h: 30 }, { x: 205, y: 195, w: 46, h: 18 }];
  let car, cones, idx, time, hits, state, t, resultT, penalty, shake;
  return {
    music: 'day',
    enter() {
      car = { x: 50, y: 232, a: -Math.PI / 2, s: 0 };
      cones = [[130, 90], [160, 60], [300, 60], [360, 70], [450, 140], [400, 175], [330, 195], [300, 160], [140, 200], [100, 150]]
        .map(c => ({ x: c[0], y: c[1], vx: 0, vy: 0, fly: 0 }));
      idx = 0; time = 0; hits = 0; penalty = 0; state = 'ready'; t = 0; resultT = 0; shake = 0;
      this.ready = 2.2;
    },
    bot() {
      if (state === 'done') { Input.pressed.a = true; return; }
      const tg = cps[Math.min(idx, cps.length - 1)];
      let da = Math.atan2(tg[1] - car.y, tg[0] - car.x) - car.a;
      while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
      Input.down.left = da < -0.08; Input.down.right = da > 0.08; Input.down.up = Math.abs(da) < 1.2; Input.down.a = false; Input.down.down = false;
    },
    update(dt) {
      t += dt;
      if (shake > 0) shake -= dt;
      if (state === 'ready') { this.ready -= dt; if (this.ready <= 0) { state = 'go'; Snd.sfx('good'); } return; }
      if (state === 'done') { resultT += dt; if (Input.pressed.a && resultT > 0.6) o.done({ time, hits, rating: this.rating }); return; }
      time += dt;
      const k = sk('rc');
      const gas = Input.down.up || Input.down.a, brake = Input.down.down;
      if (gas) car.s += 150 * dt * k; else if (brake) car.s -= 220 * dt; else car.s *= Math.pow(0.35, dt);
      car.s = clamp(car.s, -45, 135 * k);
      const steer = (Input.down.left ? -1 : 0) + (Input.down.right ? 1 : 0);
      car.a += steer * 3.0 * dt * clamp(Math.abs(car.s) / 55, 0, 1) * Math.sign(car.s || 1) * (0.9 + 0.2 * k);
      car.x += Math.cos(car.a) * car.s * dt; car.y += Math.sin(car.a) * car.s * dt;
      if (car.x < 8 || car.x > W - 8 || car.y < 8 || car.y > H - 8) { car.x = clamp(car.x, 8, W - 8); car.y = clamp(car.y, 8, H - 8); car.s *= -0.3; Snd.sfx('bump'); }
      boxes.forEach(b => {
        if (car.x > b.x - 6 && car.x < b.x + b.w + 6 && car.y > b.y - 6 && car.y < b.y + b.h + 6) {
          car.x -= Math.cos(car.a) * car.s * dt * 1.5; car.y -= Math.sin(car.a) * car.s * dt * 1.5;
          car.s *= -0.35; penalty += 0.4; Snd.sfx('bump'); shake = 0.15;
        }
      });
      cones.forEach(c => {
        if (c.fly > 0) { c.fly -= dt; c.x += c.vx * dt; c.y += c.vy * dt; return; }
        if (dist(c.x, c.y, car.x, car.y) < 9) {
          c.fly = 0.8; c.vx = Math.cos(car.a) * car.s * 1.2 + rnd(-30, 30); c.vy = Math.sin(car.a) * car.s * 1.2 + rnd(-30, 30);
          car.s *= 0.55; hits++; penalty += 1; Snd.sfx('cone'); shake = 0.2;
        }
      });
      const tg = cps[idx];
      if (dist(tg[0], tg[1], car.x, car.y) < 22) {
        idx++;
        if (idx >= cps.length) {
          state = 'done'; time += penalty;
          this.rating = time < 34 ? 'S' : time < 46 ? 'A' : time < 62 ? 'B' : 'C';
          addMood({ S: 8, A: 5, B: 2, C: 0 }[this.rating]);

// ---------- drone flight ----------
function DroneScene(o) {
  const rings = [[90, 70], [240, 55], [400, 120], [310, 215], [150, 160]];
  const trees = [[180, 105], [330, 80], [420, 190], [120, 205], [255, 150], [45, 120], [235, 215]];
  const pad = [240, 245];
  let d, idx, bat, t, state, wind, windT, shake, crashT, tree, result, landed, resultT;
  return {
    music: 'day',
    enter() {
      d = { x: 240, y: 235, vx: 0, vy: 0, alt: 0, spin: 0 };
      idx = 0; bat = 60; t = 0; state = 'ready'; wind = [0, 0]; windT = 3; shake = 0; crashT = 0; tree = false; landed = false; resultT = 0;
      this.ready = 2;
    },
    update(dt) {
      t += dt;
      if (shake > 0) shake -= dt;
      if (state === 'ready') { this.ready -= dt; if (this.ready <= 0) state = 'fly'; return; }
      if (state === 'crash') {
        crashT += dt; d.alt = Math.max(0, d.alt - 60 * dt); d.spin += dt * 12; d.vx *= 0.9; d.vy *= 0.9; d.x += d.vx * dt; d.y += d.vy * dt;
        if (crashT > 1.4) { state = 'done'; }
        return;
      }
      if (state === 'done') { resultT += dt; if (Input.pressed.a && resultT > 0.6) o.done(result); return; }
      const k = sk('drone');
      const ax = (Input.down.right ? 1 : 0) - (Input.down.left ? 1 : 0), ay = (Input.down.down ? 1 : 0) - (Input.down.up ? 1 : 0);
      d.vx += ax * 230 * dt * k + wind[0] * dt; d.vy += ay * 230 * dt * k + wind[1] * dt;
      const drag = Math.pow(0.28 / (0.9 + 0.1 * k), dt);
      d.vx *= drag; d.vy *= drag;
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.x = clamp(d.x, 6, W - 6); d.y = clamp(d.y, 6, H - 6);
      d.alt = Math.min(1, d.alt + dt * 2);
      d.spin += dt * 40;
      bat -= dt;
      windT -= dt;
      if (windT <= 0) { wind = Math.random() < 0.5 ? [0, 0] : [rnd(-60, 60), rnd(-60, 60)]; windT = rnd(2, 4); }
      const r = rings[idx];
      if (r && dist(r[0], r[1], d.x, d.y) < 14) { idx++; Snd.sfx('ring'); addMood(1); }
      for (const tr of trees) {
        if (dist(tr[0], tr[1], d.x, d.y) < 12) { this.crash(true); return; }
      }
      if (bat <= 0) { this.crash(false); return; }
      if (idx >= rings.length && Input.pressed.a) {
        const sp = Math.hypot(d.vx, d.vy);
        if (dist(pad[0], pad[1], d.x, d.y) < 22 && sp < 45) {
          landed = true; state = 'done'; Snd.sfx('finish'); addMood(8);
          result = { landed: true, tree: false, rings: idx };
          logEvent('drone_land', nm(G.player) + ' landed the drone perfectly. Everyone assumed it was luck.', true);
        } else this.crash(false);
      }
    },
    bot() {
      if (state === 'done') { Input.pressed.a = true; return; }
      if (state !== 'fly') return;
      const tg = idx < rings.length ? rings[idx] : pad;
      let vx = tg[0] - d.x, vy = tg[1] - d.y;
      const l = Math.hypot(vx, vy) || 1; vx /= l; vy /= l;
      trees.forEach(tr => { const dd = dist(tr[0], tr[1], d.x, d.y); if (dd < 48) { vx += (d.x - tr[0]) / dd * (48 - dd) / 12; vy += (d.y - tr[1]) / dd * (48 - dd) / 12; } });
      const sp = Math.hypot(d.vx, d.vy);
      const near = idx >= rings.length && dist(pad[0], pad[1], d.x, d.y) < 60;
      Input.down.left = vx < -0.3 && !(near && sp > 30 && d.vx < 0 && vx > -0.8); Input.down.right = vx > 0.3; Input.down.up = vy < -0.3; Input.down.down = vy > 0.3;
      if (near) { Input.down.left = d.vx > 6 || (vx < -0.5 && sp < 25); Input.down.right = d.vx < -6 || (vx > 0.5 && sp < 25); Input.down.up = d.vy > 6 || (vy < -0.5 && sp < 25); Input.down.down = d.vy < -6 || (vy > 0.5 && sp < 25); }
      if (idx >= rings.length && dist(pad[0], pad[1], d.x, d.y) < 18 && sp < 35) Input.pressed.a = true;
    },
    crash(hitTree) {
      state = 'crash'; crashT = 0; tree = hitTree; shake = 0.6; Snd.sfx('crash'); addMood(hitTree ? 4 : -2);
      result = { landed: false, tree: hitTree, rings: idx };
      G.flags.droneTree = hitTree; G.flags.droneCrash = true;
      logEvent(hitTree ? 'drone_tree' : 'drone_crash', hitTree
        ? "Tuomas's drone met a tree. The tree won."
        : "Tuomas's drone met the ground at an optimistic speed.", true);
    },
    draw() {
      ctx.save();
      if (shake > 0) ctx.translate(rnd(-3, 3), rnd(-3, 3));
      rect(0, 0, W, H, '#4e9a46');
      for (let i = 0; i < 160; i++) rect((i * 61) % W, (i * 37) % H, 2, 3, i % 3 ? '#439040' : '#5dac55');
      rect(210, 232, 60, 26, '#9a9fa8'); rect(212, 234, 56, 22, '#b4b8c0'); T('H', 240, 237, { size: 14, align: 'center', c: '#ff7a2a' });
      rings.forEach((p, i) => {
        if (i < idx) return;
        const cur = i === idx;
        ctx.strokeStyle = cur ? (Math.floor(t * 5) % 2 ? '#ffd166' : '#ff7aa8') : 'rgba(255,255,255,0.3)';
        ctx.lineWidth = cur ? 3 : 1; ctx.beginPath(); ctx.arc(p[0], p[1], 14, 0, 7); ctx.stroke();
      });
      trees.forEach(tr => {
        circle(tr[0] + 3, tr[1] + 4, 14, 'rgba(0,0,0,0.25)');
        circle(tr[0], tr[1], 14, '#245f2e'); circle(tr[0] - 4, tr[1] - 4, 9, '#2f7d3a'); circle(tr[0] + 5, tr[1] + 2, 6, '#3c9448');
      });
      // drone
      const lift = d.alt * 8;
      circle(d.x + 4, d.y + lift + 4, 7, 'rgba(0,0,0,0.3)');
      ctx.save(); ctx.translate(d.x, d.y - lift * 0.4);
      if (state === 'crash') ctx.rotate(d.spin);
      rect(-3, -3, 6, 6, '#222');
      [[-7, -7], [7, -7], [-7, 7], [7, 7]].forEach(p => {
        rect(p[0] / 2 - 1, p[1] / 2 - 1, 2, 2, '#444');
        const a = d.spin;
        ctx.strokeStyle = 'rgba(220,220,255,0.8)'; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(p[0] + Math.cos(a) * 5, p[1] + Math.sin(a) * 5); ctx.lineTo(p[0] - Math.cos(a) * 5, p[1] - Math.sin(a) * 5); ctx.stroke();
      });
      rect(-1, -1, 2, 2, '#ff3a3a');
      ctx.restore();
      ctx.restore();
      drawHUD();
      T('BATTERY', 6, 36, { size: 8 }); bar(52, 37, 60, 5, bat / 60, bat < 12 ? '#ff4a4a' : '#7cf04a');
      T('Rings: ' + Math.min(idx, rings.length) + '/' + rings.length, 6, 48, { size: 8, c: '#ffd166' });
      if (idx >= rings.length && state === 'fly') T('LAND ON THE H PAD: slow down and press A!', W / 2, 20, { size: 10, align: 'center', c: '#ffd166' });
      if (wind[0] || wind[1]) T('WIND!', W - 60, 40, { size: 10, c: '#bfe3ff' });
      T('Arrows: fly', W / 2, H - 12, { size: 8, align: 'center', c: '#b8b0a0' });
      if (state === 'ready') { T(this.ready > 1 ? 'PRE-FLIGHT CHECK...' : 'TAKEOFF!', W / 2, 110, { size: 22, align: 'center', c: '#ffd166' }); T('Fly through the rings. Avoid the trees. (Good luck.)', W / 2, 142, { size: 9, align: 'center', c: '#fff' }); }
      if (state === 'crash') T(tree ? 'CRASH! Into a tree!' : 'CRASH!', W / 2, 100, { size: 20, align: 'center', c: '#ff4a4a' });
      if (state === 'done') {
        panel(130, 80, 220, 80, '#10162e');
        T(landed ? 'PERFECT LANDING' : (tree ? 'TREE: 1  DRONE: 0' : 'THE DRONE IS DOWN'), W / 2, 92, { size: 13, align: 'center', c: landed ? '#8fe36a' : '#ff7a7a' });
        T('Rings: ' + Math.min(idx, rings.length) + ' / ' + rings.length, W / 2, 116, { size: 10, align: 'center' });
        T('A: continue', W / 2, 140, { size: 8, align: 'center', c: '#b8b0a0' });
      }
      drawToast();
    },
  };
}

// Minigames B: timing bar (steam / cheers), sauna endurance, group hug, cooking

// ---------- generic timing-bar minigame ----------
// cfg: { bg:(t)=>void, floor, bust, cast:[{c,x,v,y}], rounds, title, hint, zoneW, speed, texts:{hit,low,high},
//        expr:(c, state)=>expression, extra:(t,state)=>void, fg:(t)=>void, onGrade:(grade,round,state)=>void, done:(grades)=>void, music }
function TimingScene(cfg) {
  const S = { music: cfg.music };
  let m, dir, zone, round, state, grades, t, resTxt, resT, grade, sparkles;
  S.enter = function () {
    m = 0; dir = 1; round = 0; state = 'play'; grades = []; t = 0; resTxt = ''; resT = 0; sparkles = [];
    zone = rnd(0.28, 0.72); this.state = { round: 0, grades, hits: 0 };
  };
  S.bot = function () {
    if (state === 'play' && Math.abs(m - zone) < 0.025) Input.pressed.a = true;
  };
  S.update = function (dt) {
    t += dt;
    const sp = (cfg.speed || 1.25) * (1 + round * 0.12);
    if (state === 'play') {
      m += dir * sp * dt;
      if (m > 1) { m = 1; dir = -1; } else if (m < 0) { m = 0; dir = 1; }
      if (Input.pressed.a) {
        const hw = (cfg.zoneW || 0.18) / 2;
        grade = Math.abs(m - zone) <= hw ? 'hit' : (m < zone ? 'low' : 'high');
        grades.push(grade); resTxt = cfg.texts[grade]; resT = 0; state = 'result';
        this.state.hits = grades.filter(g => g === 'hit').length;
        if (cfg.onGrade) cfg.onGrade(grade, round, this.state);
      }
    } else if (state === 'result') {
      resT += dt;
      if (resT > 1.1 || (resT > 0.5 && Input.pressed.a)) {
        round++;
        if (round >= cfg.rounds) { state = 'end'; cfg.done(grades); return; }
        zone = rnd(0.25, 0.75); m = rnd(0, 1); state = 'play'; this.state.round = round;
      }
    }
  };
  S.draw = function () {
    cfg.bg(t);
    const floor = cfg.floor || 240;
    (cfg.cast || []).forEach(c => {
      const ex = cfg.expr ? cfg.expr(c.c, this.state) : undefined;
      Sprites.draw(ctx, c.c, c.v || 'in', c.x, c.y !== undefined ? c.y : floor, { bust: cfg.bust, expr: ex || (G.bac[c.c] > 0.35 ? 'drunk' : undefined) });
      if (c.c === G.player) T('▼', c.x, (c.y !== undefined ? c.y : floor) - (cfg.bust ? 58 : 76), { align: 'center', c: '#ffd166', size: 10 });
    });
    if (cfg.fg) cfg.fg(t);
    if (cfg.extra) cfg.extra(t, this.state);
    applyWobble(G.bac[G.player] * 1.0, t);
    drawHUD();
    T(cfg.title, W / 2, 30, { size: 16, align: 'center', c: '#ffd166' });
    T('Round ' + Math.min(round + 1, cfg.rounds) + ' / ' + cfg.rounds, W / 2, 50, { size: 9, align: 'center', c: '#fff' });
    // bar
    const bx = 90, bw = 300, by = 226;
    panel(bx - 8, by - 20, bw + 16, 44, '#10162e');
    rect(bx, by, bw, 14, '#2a2f45');
    rect(bx + (zone - (cfg.zoneW || 0.18) / 2) * bw, by, (cfg.zoneW || 0.18) * bw, 14, '#4fd36a');
    rect(bx + m * bw - 2, by - 5, 5, 24, '#fff');
    T(state === 'result' ? resTxt : cfg.hint, W / 2, by - 16, { size: 9, align: 'center', c: state === 'result' ? (grade === 'hit' ? '#8fe36a' : '#ff9a7a') : '#cdd8ff' });
    drawToast();
  };
  return S;
}

function EnduranceScene(o) {
  let comp, out, base, t, winner, state, ended, quip, quipT, resultT;
  return {
    music: 'sauna',
    enter() {
      comp = { rauno: 100, tuomas: 100, antti: 100 }; out = {};

      t = 0; winner = null; state = 'play'; quip = ''; quipT = 0; resultT = 0;
    },
    bot() { if (Math.random() < 0.25 || state === 'result') Input.pressed.a = true; },
    update(dt) {
      if (state === 'result') { resultT += dt; if (Input.pressed.a && resultT > 0.8) o.done({ winner }); return; }

      T('SAUNA ENDURANCE', W / 2, 30, { size: 16, align: 'center', c: '#ffd166' });
      T(out[G.player] ? 'You are out! Watching the rest...' : 'MASH A to stay in the heat! Last man standing wins.', W / 2, 52, { size: 9, align: 'center', c: '#fff' });

const HAND_NAMES = ['High card', 'Pair', 'Two pair', 'Three of a kind', 'Straight', 'Flush', 'Full house', 'Four of a kind', 'Straight flush'];

  ['.X.X.', 'XXXXX', 'XXXXX', '.XXX.', '..X..'],   // heart
  ['..X..', '.XXX.', 'XXXXX', '.XXX.', '..X..'],   // diamond

    title: 'CHEERS!', hint: 'Press A when the glasses meet in the green zone', rounds: 3, zoneW: 0.22, speed: 1.35, music: 'restaurant',
    bg: t => BG.restaurant(t), floor: 196,
    cast: [{ c: 'tuomas', x: 120, v: 'out' }, { c: 'antti', x: 240, v: 'out' }, { c: 'rauno', x: 360, v: 'out' }],
    texts: { hit: 'CLINK! Perfect cheers.', low: 'Too early. Beer on the table.', high: 'Too late. Glass meets elbow.' },
    onGrade: (g) => {
      drinkAll(1);
      if (g === 'hit') { Snd.sfx('clink'); addMood(3); for (let i = 0; i < 12; i++) sparks.push({ x: 240 + rnd(-10, 10), y: 100, vx: rnd(-60, 60), vy: rnd(-70, -10), life: 0.8 }); }
      else { Snd.sfx('bad'); addMood(-1); }
    },
    extra: (t, st) => {
      [[170, 110], [240, 100], [310, 110]].forEach((p, i) => {
        rect(p[0] - 9, p[1] - 4 + Math.sin(t * 3 + i) * 2, 18, 24, '#f0b030'); rect(p[0] - 9, p[1] - 8 + Math.sin(t * 3 + i) * 2, 18, 6, '#fff');
      });
      sparks.forEach(s => { s.x += s.vx * 0.016; s.y += s.vy * 0.016; s.vy += 3; s.life -= 0.016; rect(s.x, s.y, 2, 2, '#fff7a8'); });
      for (let i = sparks.length - 1; i >= 0; i--) if (sparks[i].life <= 0) sparks.splice(i, 1);
    },
    done: (grades) => {
      const hits = grades.filter(g => g === 'hit').length;
      logEvent('cheers', 'Three rounds of cheers were attempted. ' + hits + ' of them resulted in clinking. The rest resulted in napkins.', hits >= 2);
      go(Cutscene({
        bg: t => BG.restaurant(t), floor: BG.FLOOR.restaurant, music: 'restaurant', cast: [{ c: 'tuomas', x: 150, v: 'out' }, { c: 'antti', x: 240, v: 'out' }, { c: 'rauno', x: 330, v: 'out' }],
        steps: [
          say('tuomas', 'Cards?'),
          say('antti', 'Cards.'),
          say('rauno', 'I shall call anything.'),
          nar('A second poker round at the pub. Four hands. The beer is starting to show.'),
        ],
        onEnd: () => go(PokerScene({ hands: 4, venue: 'restaurant', music: 'restaurant', done: (w) => go(Cutscene({
          bg: t => BG.restaurant(t), floor: BG.FLOOR.restaurant, music: 'restaurant', cast: [{ c: 'tuomas', x: 150, v: 'out' }, { c: 'antti', x: 240, v: 'out' }, { c: 'rauno', x: 330, v: 'out' }],
          steps: [
            say(w, 'The pub champion has spoken. Another round on the loser.'),
            say(others(w)[0], 'I demand a rematch. At some point.'),
            nar('Last orders. The night is long, the walk home longer.'),
          ],
          onEnd: () => go(episodeCard(7)),
        })) })),
      }));
    },
  });
}

// ---------- episode 7: the way home ----------
EP_START[7] = () => Cutscene({

  cast: [{ c: 'tuomas', x: 150, v: 'out', walk: true }, { c: 'antti', x: 240, v: 'out', walk: true }, { c: 'rauno', x: 330, v: 'out', walk: true }],

    ],

  })),
});

function morningCard() {
  const avg = NAMES.reduce((a, c) => a + G.bac[c], 0) / 3;
  const txt = avg < 0.3 ? 'Surprisingly fresh. Someone forgot to drink. (Or drank wisely.)' : avg < 0.6 ? 'A mild headache and a very clear sense of satisfaction.' : 'A legendary hangover. Worth every minute.';
  return Card({ ep: 8, title: 'Next Morning', time: '10:30', text: txt, music: 'night', next: () => CreditsScene(), note: 'Roll credits...' });
}

window.__scenes = { title: TitleScene, card: episodeCard, ep: n => EP_START[n](), shop: () => ShopScene({ done: () => go(episodeCard(2)) }), credits: () => CreditsScene(), morning: morningCard };

// ===== 80-credits.js =====
// End credits: polaroid "photos" hop between left and right while text scrolls on the opposite side.

const CREDIT_HEAD = {
  shop: 'SUPPLY CHAIN', rc: 'MOTORSPORT', drone_tree: 'AVIATION', drone_land: 'AVIATION', drone_crash: 'AVIATION',
  steam: 'THERMAL ARTS', endurance: 'ENDURANCE', compliment: 'EMOTIONAL SUPPORT', hug: 'EMOTIONAL SUPPORT', hug_fail: 'EMOTIONAL SUPPORT',
  porch: 'LAKE RELATIONS', cook: 'CULINARY ARTS', golden: 'CULINARY ARTS', poker_home: 'GAMBLING (FOR HONOR)', poker_restaurant: 'GAMBLING (FOR HONOR)', poker: 'GAMBLING (FOR HONOR)',
  seagull: 'WILDLIFE', cat: 'WILDLIFE', kebab: 'LOGISTICS', cheers: 'HYDRATION', lamp: 'URBAN PLANNING', ride: 'TRANSPORT',
};
const CREDIT_EXTRA = {
  rc: ['Kevin the RC car: as himself'], drone_tree: ['The tree: as itself', 'Drone retrieval: pending'], drone_crash: ['Gravity: as itself'],
  steam: ['Steam consultant: Rauno'], endurance: ['Cooling off: nobody'], cook: ['Kitchen safety officer: none'], golden: ['Sausages: as themselves'],
  porch: ['Lake: as itself'], poker_home: ['Poker faces: sourced locally'], poker_restaurant: ['Chips: emotionally damaged'],
  ride: ['Taxi: eventually'], hug: ['Towels: reluctantly'], cheers: ['Beer: plentiful'], seagull: ['Seagull: as the winner'],
};

function drawPolaroid(x, y, rot, snap) {
  ctx.save();
  ctx.translate(Math.round(x + 106), Math.round(y + 82)); ctx.rotate(rot);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-100 + 4, -78 + 5, 212, 164);
  ctx.fillStyle = '#f4f0e4'; ctx.fillRect(-106, -82, 212, 164);
  ctx.save(); ctx.translate(-100, -76); ctx.beginPath(); ctx.rect(0, 0, 200, 113); ctx.clip();
  if (snap.canvas) ctx.drawImage(snap.canvas, 0, 0, 240, 135, 0, 0, 200, 113);
  else snap.draw(0, 0);
  ctx.restore();
  T(snap.caption || '', 0, 46, { size: 8, align: 'center', c: '#4a4038', shadow: false });
  ctx.restore();
}
// local-coordinate drawing helpers for generated "photos" (200x113 area at origin ox,oy)
function drawPoster(ox, oy) {
  ctx.save(); ctx.translate(ox, oy);
  rect(0, 0, 200, 113, mix('#d9694a', '#ffd9a0', 0.5)); rect(0, 70, 200, 43, '#4b4e5a');
  circle(150, 40, 16, '#ffe9a8');
  ['tuomas', 'antti', 'rauno'].forEach((c, i) => Sprites.draw(ctx, c, 'out', 52 + i * 48, 112, { scale: 1 }));
  ctx.restore();
}
function drawSelfie(ox, oy) {
  ctx.save(); ctx.translate(ox, oy);
  rect(0, 0, 200, 113, '#b4b6bd'); rect(0, 0, 200, 14, '#6b6d76'); rect(10, 22, 50, 50, '#9fd0f0'); rect(140, 22, 50, 50, '#9fd0f0');
  Sprites.head(ctx, 'antti', 'out', 74, 20, 2);
  Sprites.head(ctx, 'rauno', 'out', 8, 40, 2);
  Sprites.head(ctx, 'tuomas', 'out', 140, 40, 2);
  rect(0, 96, 200, 17, '#2a2c33'); rect(0, 94, 200, 3, '#44464f');
  ctx.restore();
}

function CreditsScene() {
  let slides = [], i = 0, t = 0, prev = null, prevT = 0, ended = false;
  function build() {
    slides = [];
    slides.push({ head: 'MIESTEN ILLANVIETTO', lines: ['A production of three friends', '', 'STARRING', 'Rauno as The Professor', 'Tuomas as The Pilot (allegedly)', 'Antti as The Chef', '', 'Filmed on location in Finland'], snap: { draw: drawPoster, caption: 'the guys' } });
    const byId = {};
    G.snaps.forEach(s => { byId[s.id] = s; });
    let ids = Object.keys(byId);
    if (ids.length > 9) ids = ids.filter((k, idx) => idx % Math.ceil(ids.length / 9) === 0 || idx === ids.length - 1).slice(0, 9);
    ids.forEach(id => {
      const s = byId[id];
      const log = G.log.filter(l => l.id === id).pop() || G.log.filter(l => l.id === id.split('_')[0]).pop();
      const text = log ? log.credit : s.caption;
      const lines = wrap(text, 190, 9);
      (CREDIT_EXTRA[id] || []).forEach(x => { lines.push(''); lines.push(x); });
      slides.push({ head: CREDIT_HEAD[id] || 'HIGHLIGHTS', lines, snap: { canvas: s.canvas, caption: s.caption.length > 34 ? s.caption.slice(0, 32) + '..' : s.caption } });
    });
    const label = G.mood >= 85 ? 'LEGENDARY EVENING' : G.mood >= 65 ? 'GREAT EVENING' : G.mood >= 45 ? 'SOLID EVENING' : 'AWKWARD BUT MEMORABLE EVENING';
    const stat = [label, '', 'Beers'].concat(NAMES.map(c => nm(c) + ': ' + G.beers[c]));
    stat.push('');
    if (G.flags.pokerWinner_home) stat.push('Home poker champion: ' + nm(G.flags.pokerWinner_home));
    if (G.flags.pokerWinner_restaurant) stat.push('Pub poker champion: ' + nm(G.flags.pokerWinner_restaurant));
    if (G.flags.saunaWinner) stat.push('Sauna endurance: ' + nm(G.flags.saunaWinner));
    stat.push('Burnt dinners: ' + (G.flags.burnt || 0));
    stat.push('Drone status: ' + (G.flags.droneTree ? 'in a tree' : G.flags.droneCrash ? 'on the ground' : 'airworthy'));
    const out = [];
    stat.forEach(l => wrap(l, 190, 9).forEach(x => out.push(x)));
    slides.push({ head: 'THE NUMBERS', lines: out, snap: { draw: drawSelfie, caption: 'the ride home' } });
    slides.push({ head: 'THE END', lines: ['', 'Thanks for the evening.', 'Same time next month?', '', 'Press A to play again'], snap: { draw: drawSelfie, caption: 'see you next time' }, last: true });
    slides.forEach(s => { s.dur = s.last ? 9999 : Math.max(7, (H + s.lines.length * 13) / 34); });
  }
  return {
    music: 'credits', hud: false, noSwitch: true, dpad: () => false,
    enter() { build(); i = 0; t = 0; prev = null; ended = false; (window.__trace = window.__trace || []).push('credits'); },
    update(dt) {
      t += dt; prevT += dt;
      const s = slides[i];
      if (Input.pressed.a && t > 0.5) {
        if (s.last) { Snd.sfx('confirm'); go(TitleScene()); return; }
        prev = s; prevT = 0; i++; t = 0; Snd.sfx('whoosh');
      } else if (t > s.dur && !s.last) { prev = s; prevT = 0; i++; t = 0; Snd.sfx('whoosh'); }
    },
    draw() {
      rect(0, 0, W, H, '#0a0818');
      for (let k = 0; k < 60; k++) if (Math.sin(Scenes.time * 2 + k) > -0.5) rect((k * 97) % W, (k * 53) % H, 1, 1, 'rgba(255,255,255,0.35)');
      rect(0, 0, W, 14, '#000'); rect(0, H - 14, W, 14, '#000');
      for (let x = 4; x < W; x += 16) { rect(x, 4, 8, 6, '#1a1730'); rect(x, H - 10, 8, 6, '#1a1730'); }
      const s = slides[i];
      const side = i % 2 === 0 ? 'L' : 'R';
      const target = side === 'L' ? 22 : W - 232;
      // exiting previous photo
      if (prev && prevT < 0.55) {
        const pside = (i - 1) % 2 === 0 ? 'L' : 'R';
        const px0 = pside === 'L' ? 22 : W - 232;
        const f = prevT / 0.55;
        drawPolaroid(px0 + (pside === 'L' ? -1 : 1) * f * 320, 48 - Math.sin(f * 3.14) * 18, (pside === 'L' ? -1 : 1) * 0.05 + f * 0.4 * (pside === 'L' ? -1 : 1), prev.snap);
      }
      // entering photo
      const e = clamp(t / 0.6, 0, 1), ease = 1 - Math.pow(1 - e, 3);
      const fromX = side === 'L' ? -240 : W + 30;
      const px = lerp(fromX, target, ease);
      const hop = Math.abs(Math.sin(e * 3.14 * 2)) * 22 * (1 - e);
      const float = e >= 1 ? Math.sin(t * 2) * 2 : 0;
      drawPolaroid(px, 48 - hop + float, (side === 'L' ? -1 : 1) * 0.05, s.snap);
      // scrolling text on the opposite side
      const tx = side === 'L' ? 368 : 118;
      const y0 = H - 30 - t * 34;
      ctx.save(); ctx.beginPath(); ctx.rect(side === 'L' ? 250 : 8, 16, 220, H - 32); ctx.clip();
      T(s.head, tx, y0, { size: 13, align: 'center', c: '#ffd166' });
      s.lines.forEach((l, k) => T(l, tx, y0 + 24 + k * 13, { size: 9, align: 'center', c: '#f2e6c9' }));
      ctx.restore();
      if (s.last && Math.floor(Scenes.time * 2) % 2 === 0) T('A: play again', W / 2, H - 28, { size: 9, align: 'center', c: '#fff' });
      drawToast();
    },
  };
}

// ===== 99-main.js =====
// Main loop and debug hooks
(function main() {
  let last = performance.now();
  const dbg = { speed: 1, auto: false, autoT: 0 };
  window.__dbg = {
    get G() { return G; }, Scenes, dbg,
    go(name, arg) { Scenes.go(window.__scenes[name](arg)); },
  };
  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000) * dbg.speed;
    last = now;
    if (dbg.auto && Scenes.cur && Scenes.cur.bot && Scenes.state === 'run') {
      Input.down.up = Input.down.down = Input.down.left = Input.down.right = false;
      Scenes.cur.bot();
      Input.down.a = false;
    } else if (dbg.auto) {
      dbg.autoT += dt;
      if (dbg.autoT > 0.12) {
        dbg.autoT = 0;
        const ks = ['a', 'a', 'a', 'left', 'right', 'up', 'down'];
        const k = ks[Math.floor(Math.random() * ks.length)];
        Input.pressed[k] = true;
        Input.down.a = Math.random() < 0.5;
        Input.down.up = Math.random() < 0.5; Input.down.left = Math.random() < 0.3; Input.down.right = Math.random() < 0.3;
      }
    }
    const steps = dbg.speed > 1 ? Math.ceil(dbg.speed) : 1;
    for (let i = 0; i < steps; i++) Scenes.update(dt / steps);
    if (Scenes.cur && IS_TOUCH) { const need = Scenes.cur.dpad ? !!Scenes.cur.dpad() : true; document.body.classList.toggle('nodpad', !need); }
    Scenes.draw();
    if (Scenes.cur && Scenes.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + Scenes.fade + ')'; ctx.fillRect(0, 0, W, H); }
    Input.pressed = {};
    requestAnimationFrame(frame);
  }
  Scenes.go(TitleScene());
  requestAnimationFrame(frame);
})();
